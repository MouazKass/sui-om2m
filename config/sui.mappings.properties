###############################################################################
#  !!!  READ THIS BEFORE EDITING  -  COLON ESCAPING IS MANDATORY  !!!
###############################################################################
#
# This file is loaded by java.util.Properties (SuiConfig.load(), which reads
# $OM2M_HOME/configuration/sui.mappings.properties).  In the Properties format
# BOTH '=' AND ':' are key/value separators.  The FIRST unescaped ':' in a line
# therefore ENDS THE KEY, silently and without any error.
#
# That matters here because this file's key format deliberately contains
# colons:
#
#     addr.<originator>=<0x sui address>
#     token.<originator>::<resource-id>=<0x token object id>
#
# and because the originators this testbed actually uses contain a colon
# themselves ("admin:admin" is the originator in every proofs/*.sh script and
# in bench/provision_das.sh).
#
# RULE:  escape EVERY literal colon in a KEY as  \:
#        so the "::" separator is written  \:\:
#        and the originator "admin:admin" is written  admin\:admin
#
# WRONG (silently broken - no error, no log line, just a DENY forever):
#     token.admin:admin::/in-cse/in-name/sui-protected-cnt=0xabc...
#   Properties parses this as
#       key   = "token.admin"
#       value = "admin::/in-cse/in-name/sui-protected-cnt=0xabc..."
#   The key has no "::" left in it, SuiConfig's indexOf("::") returns -1, the
#   entry is dropped, resolveToken() returns null, and SuiDasService answers
#   ACCESS_DENIED with "No Sui mapping for originator=..." on every request.
#
# RIGHT:
#     token.admin\:admin\:\:/in-cse/in-name/sui-protected-cnt=0xabc...
#
# The addr.* lines fail the same way, and worse - they produce a WRONG entry
# rather than no entry at all:
#     addr.admin:admin=0xdef        ->  key "addr.admin", value "admin=0xdef"
#   so resolveAddress("admin:admin") returns null AND a junk mapping for the
#   originator "admin" now holds the literal string "admin=0xdef" as an address.
#   (Both behaviours verified against java.util.Properties, JDK 21.)
#
# RIGHT:
#     addr.admin\:admin=0xdef...
#
# Values need NO escaping - only the key, and only up to the first '='.
# Forward slashes, dots and hex digits need no escaping anywhere.
#
# One more limit to be aware of: SuiConfig splits on the FIRST "::" it finds in
# the (already unescaped) key.  That is correct for "admin:admin" because it
# contains only single colons.  An originator that itself contains a DOUBLE
# colon cannot be expressed in this format at all - rename the originator.
#
# After any edit, verify the file really parsed:
#     docker logs om2m-active 2>&1 | grep -i "No Sui mapping"
# A GRANT-capable originator that still shows up there is almost always an
# unescaped colon in this file, not a chain problem.
#
###############################################################################
#  Deployment notes
###############################################################################
#
# * This is a TEMPLATE.  Each node gets its OWN copy of this file; the token
#   ids differ per node because a CapToken is an owned object and the PTB only
#   succeeds on the node that owns it (see RECOVERY.md: rpi3 is the
#   GRANT-capable node, rpi1 is the cross-node DENIAL test node).
# * On the Pis the live copy is mounted from /tmp/sui.mappings.properties with
#   the durable original in ~/sui-runtime-config/ (RECOVERY.md breakage 1).
# * The object ids below are the v7 deployment values from scripts/env.sh.
#   The security-fixes-v8 batch publishes a FRESH package, so every CapToken
#   id here becomes invalid the moment v8 is published and minted - re-mint and
#   re-write this file then.
#
###############################################################################


# --- Originator -> Sui address --------------------------------------------
# Key form:  addr.<originator>
# Note the escaped colon in "admin\:admin".

# The administrative originator used by every proofs/*.sh script, by
# bench/provision_das.sh and by install_das_persistence.sh.
# Point it at THIS node's own address (sui.node.address in sui.properties).
# Example below = rpi3 (10.25.96.203), $RPI3 in scripts/env.sh.
addr.admin\:admin=0x27dacda1bdcb3fb8dc2a4b0d77b420deea5bb43d1047592ddadb19f35764ea10

# The sensor originator used by bench/bench_access_latency.sh and added to the
# OM2M ACP (acop 63) by bench/provision_das.sh step 3.
addr.Csensor-001=0x27dacda1bdcb3fb8dc2a4b0d77b420deea5bb43d1047592ddadb19f35764ea10

# Other nodes, for cross-node tests. On rpi1 ($RPI1) point Csensor-001 at
# rpi1's address while leaving the token below as rpi3's: that is exactly the
# configuration proofs/05_policy.sh relies on to produce a DENY.
#addr.Csensor-001=0xef9c6271d8c6cc9e1d9707a117f876e7a8679509f141879bc05ae7bcffe1d5f9
#addr.Csensor-002=0x4be6060abaff0b4b6b7229558887f5f054cbe7d9836ba56eff35d848e13dc1f5


# --- (Originator, resource) -> CapToken object id -------------------------
# Key form:  token.<originator>::<resource-id>
# written as token.<originator with \: >\:\:<resource-id>
#
# <resource-id> must match the "rid" field of the dreq EXACTLY as the DAS
# receives it, i.e. the absolute OM2M path. The testbed's protected container
# is /in-cse/in-name/sui-protected-cnt (created by bench/provision_das.sh
# step 5 and by install_das_persistence.sh).

# admin:admin on the protected container. Value = $CAP_TOKEN_RPI3 (v7).
token.admin\:admin\:\:/in-cse/in-name/sui-protected-cnt=0x5a352656c7cf310a9861ed226e4e985fe9a10e4841da71b60b0868824682bc02

# Csensor-001 on the same container (the bench_access_latency.sh originator).
token.Csensor-001\:\:/in-cse/in-name/sui-protected-cnt=0x5a352656c7cf310a9861ed226e4e985fe9a10e4841da71b60b0868824682bc02

# The sample resource path that scripts/bootstrap_testbed.sh installs a policy
# for and mints a token against ($SAMPLE_RES). Uncomment and fill in with the
# token id that the "Mint a CapToken to MN1" step prints.
#token.admin\:admin\:\:/in-cse/AE-temp/cnt-readings=0xPLACEHOLDER_CNT_READINGS_TOKEN

# A resource with NO token entry is the fail-closed case: the DAS logs
# "No Sui mapping for originator=... resource=..." and returns ACCESS_DENIED
# without touching the chain. That is intended behaviour, not a bug.
